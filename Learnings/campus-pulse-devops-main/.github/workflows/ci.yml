name: Campus Pulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: flake8 app tests wsgi.py
      - run: yamllint .github/workflows/ci.yml
      - run: pytest -v
      - run: pip-audit -r requirements.txt

  container:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t campus-pulse:test .
      - name: Start production container
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          docker run -d --name campus-pulse -p 8080:8080 \
            -e APP_ENV=production \
            -e SECRET_KEY="${APP_SECRET_KEY:-ci-training-secret}" \
            campus-pulse:test
      - name: Smoke test
        run: bash scripts/healthcheck.sh http://localhost:8080/health 15 2
      - name: Show logs on failure
        if: failure()
        run: docker logs campus-pulse

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
